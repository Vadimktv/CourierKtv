<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Courier Assist</title>
    <meta http-equiv="refresh" content="0; url=./src/public/index.html" />
    <link rel="canonical" href="./src/public/index.html" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(circle at top left, #eef2ff, #e0f2fe);
        color: #0f172a;
      }

      .redirect-card {
        max-width: 420px;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 16px;
        padding: 1.75rem 2rem;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
        text-align: center;
      }

      .redirect-card h1 {
        margin: 0 0 0.75rem;
        font-size: 1.6rem;
        color: #2563eb;
      }

      .redirect-card p {
        margin: 0 0 1rem;
        line-height: 1.5;
      }

      .redirect-card a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        box-shadow: 0 16px 35px rgba(37, 99, 235, 0.35);
      }

      .redirect-card small {
        display: block;
        margin-top: 1rem;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="redirect-card">
      <h1>Открываем обновлённый интерфейс</h1>
      <p>
        Если страница не перешла автоматически, нажмите на кнопку ниже, чтобы открыть новую версию
        приложения курьера.
      </p>
      <a href="./src/public/index.html">Перейти к приложению</a>
      <small>Все изменения теперь доступны по адресу <code>src/public/index.html</code>.</small>
    </div>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        try {
          const target = './src/public/index.html';
          const resolved = new URL(target, window.location.href);
          if (window.location.href !== resolved.href) {
            window.location.replace(resolved.href);
          }
        } catch (error) {
          console.error('Не удалось перенаправить автоматически', error);
        }
      });
    </script>
  </body>
</html>
